<div class="dialog-title">
    <h2 class="text-center"
        mat-dialog-title>
        {{ 'AUTH-DIALOG.TITLE' | translate }}
    </h2>
    <p class="text-center muted">
        {{ 'AUTH-DIALOG.SUBTITLE' | translate }}
    </p>
</div>

<mat-dialog-content>

    <div class="social-login">
        <button class="google-login btn">
            <img src="https://lh3.googleusercontent.com/COxitqgJr1sJnIDe8-jiKhxDx1FrYbtRHKJ9z_hELisAlapwE9LUPh6fcXIfb5vwpbMl4xl9H9TRFPc5NOO8Sb3VSgIBrfRYvW6cUA"
                 alt=""
                 width="30">
            {{ "AUTH-DIALOG.GOOGLE-LOGIN" | translate }}
        </button>
        <button class="google-login btn">
            <svg height="32"
                 aria-hidden="true"
                 viewBox="0 0 16 16"
                 version="1.1"
                 width="32"
                 data-view-component="true"
                 class="github-logo">
                <path
                      d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z">
                </path>
            </svg>
            {{ "AUTH-DIALOG.GITHUB-LOGIN" | translate }}
        </button>
    </div>

    <div class="divider">
        <hr>
        <small> {{ "AUTH-DIALOG.OR" | translate }} </small>
        <hr>
    </div>

    <div class="form-section">
        <!-- LOGIN -->
        <div class="form-login"
             [class.show-register-form]="showRegisterForm">
            <form>
                <div class="email-input-wrapper input-wrapper">
                    <label class="label-input"
                           for="email">
                        {{ "AUTH-DIALOG.LABEL-EMAIL" | translate }}
                    </label>
                    <input type="email"
                           id="email"
                           placeholder="{{ 'AUTH-DIALOG.EMAIL-EXAMPLE' | translate }}"
                           class="input">
                    <small></small>
                </div>
                <div class="password-input-wrapper input-wrapper">
                    <label class="label-input"
                           for="password">
                        {{ "AUTH-DIALOG.LABEL-PASSWORD" | translate }}
                    </label>
                    <input type="password"
                           id="password"
                           placeholder="********"
                           class="input">
                </div>

                <a href="#"
                   style="color: red;text-align: end;font-size: 1rem;float: end;">Forgot password?</a>
            </form>

            <button class="btn-color btn-login">
                {{ "AUTH-DIALOG.BUTTON-LOGIN" | translate }}
            </button>

            <div class="register-now ">
                <p class="text-center"> {{ "AUTH-DIALOG.NO-ACCOUNT" | translate }} </p>
                <button class="btn-register" (click)="showRegisterForm = true"> {{ "AUTH-DIALOG.CREATE-ACCOUNT" | translate }} </button>
            </div>
        </div>

        <!-- SIGN UP -->
        <div class="form-register"
             [class.show-register-form]="showRegisterForm">
            <form>
                <div class="email-input-wrapper input-wrapper">
                    <label class="label-input"
                           for="email">
                        {{ "AUTH-DIALOG.LABEL-EMAIL" | translate }}
                    </label>
                    <input type="email"
                           id="email"
                           placeholder="{{ 'AUTH-DIALOG.EMAIL-EXAMPLE' | translate }}"
                           class="input">
                    <small></small>
                </div>
                <div class="password-input-wrapper input-wrapper">
                    <label class="label-input"
                           for="password">
                        {{ "AUTH-DIALOG.LABEL-PASSWORD" | translate }}
                    </label>
                    <input type="password"
                           id="password"
                           placeholder="********"
                           class="input">
                </div>

                <a href="#"
                   style="color: red;text-align: end;font-size: 1rem;visibility: hidden;">Forgot password?</a>
            </form>

            <button class="btn-color btn-login">
                {{ "AUTH-DIALOG.BUTTON-REGISTER" | translate }}
            </button>

            <div class="register-now ">
                <p class="text-center"> {{ "AUTH-DIALOG.YES-ACCOUNT" | translate }} </p>
                <button class="btn-register" (click)="showRegisterForm = false"> {{ "AUTH-DIALOG.LOGIN" | translate }} </button>
            </div>

        </div>

    </div>


</mat-dialog-content>
