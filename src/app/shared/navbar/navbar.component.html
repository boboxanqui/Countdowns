<nav>
    <div class="logo">
        <h1>Logo</h1>
    </div>
    <div class="settings"
         [class.logged-in]="userData.active">

        <!-- LANGUAGE DROPDOWN -->
        <div class="custom-list-lang pointer unselect"
             (mouseleave)="langOptionsOpen = false">
            <div class="selected-lang"
                 (click)="langOptionsOpen = !langOptionsOpen">
                <div class="lang-option">
                    <img [src]="langSelected.flag"
                         class="flag-lang">
                    <span class="lang-name">{{ langSelected.name }}</span>
                    <img src="../../../assets/icons/arrow-clay-80x80.webp"
                         alt="flecha"
                         class="lang-arrow-menu dark-theme-icon"
                         width="20"
                         [class.rotate-180]="!langOptionsOpen">
                    <img src="../../../assets/icons/arrow-clay-color-80x80.webp"
                         alt="flecha"
                         class="lang-arrow-menu light-theme-icon"
                         width="20"
                         [class.rotate-180]="!langOptionsOpen">
                </div>
            </div>
            <div class="lang-list"
                 [class.show-lang-list]="langOptionsOpen"
                 (blur)="langOptionsOpen = false">
                <div class="lang-option lang-option-list"
                     *ngFor="let lenguage of langList"
                     (click)="changeLang(lenguage.lang)">
                    <img [src]="lenguage.flag"
                         class="flag-lang">
                    <span class="lang-name muted"> {{ lenguage.name }} </span>
                </div>
            </div>
        </div>

        <!-- THEME SWITCHER -->
        <div class="theme-selector">
            <div class="icon-box"
                 (click)="switchTheme(false)"
                 [class]="darkMode ? 'dark-mode' : 'light-mode'">
                <img src="../../../assets/icons/sun-color_80x80.webp"
                     alt="Sun icon color"
                     class="sun-icon">
            </div>
            <div class="icon-box"
                 (click)="switchTheme(true)"
                 [class]="darkMode ? 'dark-mode' : 'light-mode'">
                <img src="../../../assets/icons/moon-color-80x80.webp"
                     alt="Moon icon color"
                     class="moon-icon">
            </div>
        </div>

        <!-- AUTH -->
        <div class="user-account pointer"
             *ngIf="userData.active; else noUserActive"
             (click)="userOptionsOpen = !userOptionsOpen"
             (mouseleave)="userOptionsOpen = false">
            <div class="user-wrapper">
                <span class="user-name">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11.9667 1.75195C9.81618 1.76239 7.72323 2.4468 5.98323 3.70856C4.24323 4.97032 2.94402 6.74571 2.26894 8.78424C1.59387 10.8228 1.57703 13.0215 2.22077 15.0701C2.86452 17.1187 4.13635 18.9138 5.85681 20.202C5.90685 20.2507 5.96434 20.2912 6.02709 20.322C7.7668 21.5741 9.85708 22.248 12.0017 22.248C14.1464 22.248 16.2367 21.5741 17.9764 20.322C18.0421 20.2869 18.1027 20.2432 18.1567 20.192C19.877 18.8994 21.1468 17.0996 21.7865 15.0471C22.4261 12.9945 22.4032 10.7931 21.721 8.7543C21.0389 6.71546 19.7319 4.94233 17.985 3.68573C16.2382 2.42913 14.1398 1.75265 11.9867 1.75195H11.9667ZM11.9667 5.51196C12.7921 5.50205 13.6018 5.73775 14.2926 6.18903C14.9834 6.6403 15.5239 7.28669 15.8454 8.04584C16.1668 8.80498 16.2545 9.64249 16.0974 10.4516C15.9403 11.2607 15.5454 12.0048 14.963 12.589C14.3807 13.1732 13.6374 13.5711 12.8277 13.7319C12.0181 13.8927 11.1788 13.8092 10.4169 13.492C9.65495 13.1748 9.00487 12.6383 8.54951 11.9508C8.09415 11.2634 7.85414 10.4561 7.86004 9.63196C7.86783 8.54512 8.30238 7.50471 9.07028 6.73431C9.83818 5.96392 10.8781 5.52503 11.9667 5.51196ZM16.5942 19.4319C15.2071 20.2944 13.6058 20.7515 11.9717 20.7515C10.3376 20.7515 8.73627 20.2944 7.34921 19.4319C6.918 19.1703 6.51226 18.869 6.13726 18.532C6.70519 17.7242 7.43513 17.0431 8.28074 16.532C9.39741 15.869 10.6725 15.5191 11.9717 15.5191C13.2709 15.5191 14.546 15.869 15.6627 16.532C16.5083 17.0431 17.2382 17.7242 17.8061 18.532C17.4311 18.869 17.0254 19.1703 16.5942 19.4319Z" fill="currentColor"/>
                        </svg>

                    <span class="user-name-text">
                        {{ accountLabel }}
                    </span>
                </span>
                <img src="../../../assets/icons/arrow-clay-80x80.webp"
                     alt="flecha"
                     class="lang-arrow-menu dark-theme-icon"
                     width="20"
                     [class.rotate-180]="!userOptionsOpen">
                <img src="../../../assets/icons/arrow-clay-color-80x80.webp"
                     alt="flecha"
                     class="lang-arrow-menu light-theme-icon"
                     width="20"
                     [class.rotate-180]="!userOptionsOpen">
            </div>
            <div class="user-options"
                 [class.show-user-options]="userOptionsOpen"
                 (blur)="userOptionsOpen = false">
                <!-- Shown only on narrow screens, where the account trigger
                     collapses to just the avatar and loses its name label. -->
                <div class="dropdown-username muted"> {{ accountLabel }} </div>
                <ul>
                    <li class="logout" (click)="logout()">
                        <svg width="24"
                             height="24"
                             viewBox="0 0 24 24"
                             fill="none"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="M13.4767 21.2448H8.34067C7.04877 21.3045 5.78536 20.8527 4.82407 19.9876C3.86278 19.1224 3.28099 17.9134 3.2047 16.6224V7.37762C3.28099 6.08659 3.86278 4.87757 4.82407 4.01241C5.78536 3.14724 7.04877 2.69559 8.34067 2.75524H13.4767"
                                  stroke="currentColor"
                                  stroke-width="1.5"
                                  stroke-linecap="round"
                                  stroke-linejoin="round" />
                            <path d="M20.7953 12H7.44174"
                                  stroke="currentColor"
                                  stroke-width="1.5"
                                  stroke-miterlimit="10"
                                  stroke-linecap="round" />
                            <path d="M16.0833 17.136L20.4874 12.7319C20.6802 12.5371 20.7884 12.2742 20.7884 12C20.7884 11.7259 20.6802 11.4629 20.4874 11.2681L16.0833 6.86404"
                                  stroke="currentColor"
                                  stroke-width="1.5"
                                  stroke-linecap="round"
                                  stroke-linejoin="round" />
                        </svg>
                        <span> {{ 'NAVBAR.LOGOUT' | translate }} </span>
                    </li>
                </ul>
                <!-- LANGUAGE OPTIONS (only shown here on narrow screens, where the
                     standalone language dropdown is hidden) -->
                <div class="menu-lang-options">
                    <button type="button"
                            class="menu-lang-option"
                            *ngFor="let lenguage of langList"
                            [class.selected]="lenguage.lang === currentLang"
                            [attr.aria-label]="lenguage.name"
                            [attr.title]="lenguage.name"
                            (click)="changeLang(lenguage.lang)">
                        <img [src]="lenguage.flag"
                             class="flag-lang">
                    </button>
                </div>
            </div>
        </div>

        <ng-template #noUserActive>
            <div class="auth-btn-wrapper">
                <button class="btn btn-login text-center"
                        (click)="openAuthDialog(false)">
                    {{ 'NAVBAR.LOGIN' | translate }}
                </button>
                <button class="btn-color text-center"
                        (click)="openAuthDialog(true)">
                    {{ 'NAVBAR.REGISTER' | translate }}
                </button>
            </div>
        </ng-template>
    </div>
</nav>
