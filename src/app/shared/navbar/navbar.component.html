<nav>
    <div class="logo">
        <h1>Logo</h1>
    </div>
    <div class="settings">

        <!-- LANGUAGE DROPDOWN -->
        <div class="custom-list-lang pointer unselect" (mouseleave)="langOptionsOpen = false">
            <div class="selected-lang"
                 (click)="langOptionsOpen = !langOptionsOpen"
                  >
                <div class="lang-option">
                    <img [src]="langSelected.flag"
                         class="flag-lang">
                    <span class="lang-name">{{ langSelected.name }}</span>
                    <img src="../../../assets/icons/arrow-clay-80x80.webp"
                         alt="flecha"
                         class="lang-arrow-menu dark-theme-icon"
                         width="20"
                         [class.rotate-180]="!langOptionsOpen">
                    <img src="../../../assets/icons/arrow-clay-color-80x80.webp"
                         alt="flecha"
                         class="lang-arrow-menu light-theme-icon"
                         width="20"
                         [class.rotate-180]="!langOptionsOpen">
                </div>
            </div>
            <div class="lang-list"
                 [class.show-lang-list]="langOptionsOpen" (blur)="langOptionsOpen = false">
                <div class="lang-option lang-option-list"
                     *ngFor="let lenguage of langList"
                     (click)="changeLang(lenguage.lang)">
                    <img [src]="lenguage.flag"
                         class="flag-lang">
                    <span class="lang-name muted"> {{ lenguage.name }} </span>
                </div>
            </div>
        </div>

        <!-- THEME SWITCHER -->
        <div class="theme-selector">
            <div class="icon-box"
                 (click)="switchTheme(false)"
                 [class]="darkMode ? 'dark-mode' : 'light-mode'">
                <img src="../../../assets/icons/sun-color_80x80.webp"
                     alt="Sun icon color"
                     class="sun-icon">
            </div>
            <div class="icon-box"
                 (click)="switchTheme(true)"
                 [class]="darkMode ? 'dark-mode' : 'light-mode'">
                <img src="../../../assets/icons/moon-color-80x80.webp"
                     alt="Moon icon color"
                     class="moon-icon">
            </div>
        </div>
