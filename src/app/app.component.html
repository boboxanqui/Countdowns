<app-navbar (darkModeOn)="switchTheme($event)"></app-navbar>

<main>
    <!-- COUNTDOWN RENDER -->

    <div *ngIf="countdowns.length > 0; else noCountdowns">
        <div class="countdowns-wrapper"
             *ngFor="let countdown of countdowns">
    
            <countdown-card [countdown]="countdown"></countdown-card>
    
            <article class="countdown-card new-countdown-card"
                (click)="openNewCountdownForm()">
                <img src="../assets/icons/plus-front-color-80x80.webp"
                     alt="icono con el símbolo más"
                     width="80"
                     class="dark-theme-icon">
                <img src="../assets/icons/plus-front-gradient-80x80.webp"
                     alt="icono con el símbolo más"
                     width="80"
                     class="light-theme-icon">
            </article>
        </div>
    </div>

    <!-- NO COUNTDOWN MENU -->
    <ng-template #noCountdowns>
        <article class="no-countdowns">
            <h2>{{ 'MAIN.SLOGAN' | translate | uppercase }}</h2>
            <h3 class="muted"> {{ 'MAIN.SLOGAN-PART-2' | translate }} <br> {{ 'MAIN.SLOGAN-PART-3' | translate }}</h3>
            <div class="arrow-down">
                <p class="muted">{{ 'MAIN.PRESS-BUTTON' | translate }}</p>
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="160"
                     height="160"
                     viewBox="0 0 256 256">
                    <g fill="currentColor">
                        <path d="m224 136l-96 96l-96-96h48V72h96v64Z"
                              opacity=".2" />
                        <path
                              d="M231.39 132.94A8 8 0 0 0 224 128h-40V72a8 8 0 0 0-8-8H80a8 8 0 0 0-8 8v56H32a8 8 0 0 0-5.66 13.66l96 96a8 8 0 0 0 11.32 0l96-96a8 8 0 0 0 1.73-8.72M128 220.69L51.31 144H80a8 8 0 0 0 8-8V80h80v56a8 8 0 0 0 8 8h28.69ZM72 40a8 8 0 0 1 8-8h96a8 8 0 0 1 0 16H80a8 8 0 0 1-8-8" />
                    </g>
                </svg>
            </div>
            <div class="btn-box">
                <button class="btn-first-countdown"
                        (click)="openNewCountdownForm()">
                    <h4 class="text-new">
                        {{ 'MAIN.CREATE-COUNTDOWN' | translate }}
                    </h4>
                </button>
            </div>
        </article>
    </ng-template>

</main>
